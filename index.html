<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Studio — Interactive 3D Desk Setup Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body data-theme="night">
    <!-- Fullscreen 3D Canvas Container -->
    <div id="canvas-wrap" aria-label="Interactive 3D Desk Setup"></div>

    <!-- Projected 3D Hotspot Pins Layer -->
    <div id="hotspots-layer" aria-hidden="false"></div>

    <!-- Hover Tooltip for Raycasted 3D Meshes -->
    <div id="hover-tooltip" class="hover-tooltip" role="status" aria-live="polite">
      <span class="tooltip-dot"></span>
      <span id="tooltip-label">Ultrawide Display</span>
      <span class="tooltip-hint">Click to inspect</span>
    </div>

    <!-- Top Navigation & Controls HUD -->
    <header class="hud-header">
      <div class="brand-card glass">
        <div class="brand-badge">3D SPATIAL TOUR</div>
        <div class="brand-row">
          <h1 class="brand-title">Aether Desk Setup</h1>
          <span class="brand-pill">Three.js + Motion</span>
        </div>
      </div>

      <div class="controls-bar glass">
        <button id="btn-lamp" class="ctrl-btn is-active" type="button" title="Toggle Desk Lamp">
          <span class="ctrl-icon">💡</span>
          <span>Lamp: <strong id="lamp-status">ON</strong></span>
        </button>

        <button id="btn-theme" class="ctrl-btn" type="button" title="Switch Day / Night Lighting">
          <span class="ctrl-icon" id="theme-icon">🌙</span>
          <span id="theme-label">Night RGB</span>
        </button>

        <button id="btn-autorotate" class="ctrl-btn" type="button" title="Toggle Auto Orbit">
          <span class="ctrl-icon">🔄</span>
          <span>Orbit</span>
        </button>

        <button id="btn-reset" class="ctrl-btn ctrl-primary" type="button" title="Reset 3D Camera">
          <span>Reset View</span>
        </button>
      </div>
    </header>

    <!-- Selected Item Detail Popup Card -->
    <aside id="detail-card" class="detail-card glass" aria-hidden="true">
      <div class="detail-top">
        <span id="detail-category" class="detail-category">Display & Creative Hub</span>
        <button id="btn-close-detail" class="close-btn" type="button" aria-label="Close details">
          ✕
        </button>
      </div>

      <div class="detail-title-row">
        <h2 id="detail-title" class="detail-title">Ultrawide Display</h2>
        <span id="detail-price" class="detail-price">$899</span>
      </div>

      <div id="detail-badge" class="detail-badge">34" OLED • 240Hz</div>

      <p id="detail-desc" class="detail-desc"></p>

      <div id="detail-specs" class="detail-specs"></div>

      <div class="detail-actions">
        <button id="btn-prev-item" class="nav-btn" type="button">← Prev</button>
        <button id="btn-next-item" class="nav-btn nav-btn-accent" type="button">Next Item →</button>
      </div>
    </aside>

    <!-- Bottom Quick Jump Dock & Controls Hint -->
    <footer class="hud-footer">
      <nav id="quick-dock" class="quick-dock glass" aria-label="Quick camera presets">
        <button class="dock-btn is-active" data-target="overview" type="button">Overview</button>
      </nav>
      <div class="hint-pill glass">
        Drag to rotate 360° • Scroll to zoom • Click any 3D item or pin to inspect
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
