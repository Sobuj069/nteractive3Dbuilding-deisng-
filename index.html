<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Tower — Interactive 3D Building Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body data-theme="sunset">
    <!-- Fullscreen 3D Canvas Container -->
    <div id="canvas-wrap" aria-label="Interactive 3D Building Design"></div>

    <!-- Projected 3D Architectural Hotspot Pins -->
    <div id="hotspots-layer" aria-hidden="false"></div>

    <!-- Hover Tooltip for Raycasted 3D Zones -->
    <div id="hover-tooltip" class="hover-tooltip" role="status" aria-live="polite">
      <span class="tooltip-dot"></span>
      <span id="tooltip-label">Double-Height Grand Atrium</span>
      <span class="tooltip-hint">Click to inspect</span>
    </div>

    <!-- Top Navigation & Architectural Controls HUD -->
    <header class="hud-header">
      <div class="brand-card glass">
        <div class="brand-badge">ARCHITECTURAL 3D SHOWCASE</div>
        <div class="brand-row">
          <h1 class="brand-title">Aether Sky Tower</h1>
          <span class="brand-pill">10 Floors • 44m</span>
        </div>
      </div>

      <div class="controls-bar glass">
        <button id="btn-explode" class="ctrl-btn" type="button" title="Separate Building Tiers Vertically">
          <span class="ctrl-icon">🧱</span>
          <span id="explode-label">Explode Floors</span>
        </button>

        <button id="btn-assemble" class="ctrl-btn" type="button" title="Replay Building Assembly Animation">
          <span class="ctrl-icon">✨</span>
          <span>Assemble</span>
        </button>

        <button id="btn-time" class="ctrl-btn" type="button" title="Switch Sunlight / Golden Hour / Night">
          <span class="ctrl-icon" id="time-icon">🌇</span>
          <span id="time-label">Golden Hour</span>
        </button>

        <button id="btn-autorotate" class="ctrl-btn" type="button" title="Toggle 360° Auto Orbit">
          <span class="ctrl-icon">🔄</span>
          <span>Orbit</span>
        </button>

        <button id="btn-reset" class="ctrl-btn ctrl-primary" type="button" title="Reset Camera View">
          <span>Reset View</span>
        </button>
      </div>
    </header>

    <!-- Selected Architectural Zone Detail Popup -->
    <aside id="detail-card" class="detail-card glass" aria-hidden="true">
      <div class="detail-top">
        <span id="detail-category" class="detail-category">Ground & Mezzanine Podium</span>
        <button id="btn-close-detail" class="close-btn" type="button" aria-label="Close details">
          ✕
        </button>
      </div>

      <div class="detail-title-row">
        <h2 id="detail-title" class="detail-title">Double-Height Grand Atrium</h2>
        <span id="detail-metric" class="detail-price">7.2m</span>
      </div>

      <div id="detail-badge" class="detail-badge">Low-E Curtain Wall • Travertine Core</div>

      <p id="detail-desc" class="detail-desc"></p>

      <div id="detail-specs" class="detail-specs"></div>

      <div class="detail-actions">
        <button id="btn-prev-item" class="nav-btn" type="button">← Prev Zone</button>
        <button id="btn-next-item" class="nav-btn nav-btn-accent" type="button">Next Zone →</button>
      </div>
    </aside>

    <!-- Bottom Quick Jump Dock & Controls Hint -->
    <footer class="hud-footer">
      <nav id="quick-dock" class="quick-dock glass" aria-label="Quick floor and zone navigation">
        <button class="dock-btn is-active" data-target="overview" type="button">Overview</button>
      </nav>
      <div class="hint-pill glass">
        Drag to orbit 360° • Scroll to zoom • Click any floor or pin • Try “Explode Floors”
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
